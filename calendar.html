<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="journal.html">Journal</a></li>
        <li><button id="theme-button"> 🌙 Dark Mode OFF</button></li>
        <li><button id="reduce-motion-btn">💫 Reduce Motion ON</button></li>
      </ul>
    </div>

    <main style="padding:110px 16px 80px;">
      <h2 style="text-align:center;">Journal Calendar</h2>
      <div style="display:flex;justify-content:center;gap:12px;margin-bottom:12px;">
        <button id="calendar-prev" class="header-button">◀ Prev</button>
        <div id="calendar-current" style="align-self:center;font-weight:700;"></div>
        <button id="calendar-next" class="header-button">Next ▶</button>
      </div>
      <div id="calendar-grid" style="max-width:1000px;margin:18px auto;"></div>
      <div id="calendar-details" style="max-width:1000px;margin:18px auto;padding:12px;background:var(--card-bg);border-radius:10px;"></div>

      <div style="max-width:1000px;margin:8px auto;display:flex;gap:8px;justify-content:flex-end;">
        <button id="export-data" class="header-button">Export Data</button>
        <label class="header-button" style="cursor:pointer;">
          Import
          <input id="import-file" type="file" accept="application/json" style="display:none;" />
        </label>
      </div>
    </main>

    <div class="footer"><a href="index.html" id="footer-link">Back to Home</a></div>
    <script src="site.js"></script>
    <script src="index.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderCalendar();
      });
    </script>
  </body>
</html>
