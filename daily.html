<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daily Check-In</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><button id="theme-button"> 🌙 Dark Mode OFF</button></li>
        <li><button id="reduce-motion-btn">💫 Reduce Motion ON</button></li>
      </ul>
    </div>

    <main style="padding: 110px 20px 80px; text-align:center;">
      <h2>How are you feeling today?</h2>
      <p>Select a mood that best fits how you feel right now.</p>
      <div id="mood-grid" style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:800px;margin:20px auto;"></div>
      <p id="mood-selected" style="margin-top:20px;"></p>
      <a href="activities.html" class="header-button" style="display:inline-block;margin-top:16px;">See Activities</a>

      <!-- Inline journaling area that appears after mood selection -->
      <section id="daily-journal-section" style="display:none;max-width:900px;margin:20px auto;text-align:left;">
        <h3 id="daily-journal-heading">Write about your mood</h3>
        <button id="daily-prompt-btn" class="header-button" style="margin-bottom:8px;">Get a prompt</button>
        <span id="daily-prompt" style="margin-left:12px;font-style:italic;color:var(--text-color);"></span>
        <textarea id="daily-journal-text" placeholder="Write what made you feel this way..." style="width:100%;height:180px;margin-top:12px;padding:12px;font-size:16px;"></textarea>
        <div style="margin-top:12px;text-align:right;">
          <button id="daily-save-btn" class="header-button">Save Entry</button>
        </div>
      </section>
    </main>

    <div class="footer">
      <a href="index.html" id="footer-link">Back to Home</a>
    </div>

    <script src="site.js"></script>
    <script src="index.js"></script>
  </body>
</html>
