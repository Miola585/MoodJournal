<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weekly Summary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="journal.html">Journal</a></li>
        <li><button id="theme-button"> 🌙 Dark Mode OFF</button></li>
      </ul>
    </div>

    <main style="padding:110px 16px 80px;">
      <h2 style="text-align:center;">Weekly Summary</h2>
      <div id="weekly-summary" style="max-width:900px;margin:18px auto;padding:12px;background:var(--card-bg);border-radius:10px;">
        <div id="weekly-stats" style="margin-bottom:12px;"></div>
        <canvas id="weekly-chart" width="700" height="300" style="display:block;margin:12px auto;background:transparent;border-radius:6px;">
          Your browser does not support canvas.
        </canvas>
        <div id="weekly-legend" style="max-width:700px;margin:0 auto;text-align:left;padding-top:8px;"></div>
        <div id="weekly-text-fallback" style="font-size:16px;margin-top:16px;"></div>
      </div>
    </main>

    <div class="footer"><a href="../index.html" id="footer-link">Back to Home</a></div>
    <script src="site.js"></script>
    <script src="index.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderWeeklySummary();
      });
    </script>
  </body>
</html>
