name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, build, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_HTML_OUTPUT_DIR: .cache/visual-check/playwright-report
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and production build
        run: npm test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Chromium browser tests
        run: npm run test:e2e -- --workers=1 --forbid-only --trace=retain-on-failure --reporter=list,html --output=.cache/visual-check/test-results

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-test-results
          path: |
            .cache/visual-check/playwright-report/
            .cache/visual-check/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
